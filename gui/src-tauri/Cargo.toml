[package]
name = "penumbra-gui"
version = "1.2.0"
description = "A modern GUI for Penumbra - MediaTek device tool"
authors = ["coolishsec0175"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "penumbra_gui_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
once_cell = "1"
hex = "0.4"
toml = "0.8"
dirs = "6"
config = "0.15"
ureq = "3"
url = "2"
penumbra = { path = "../../core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Threading", "Win32_Foundation"] }

[lints.clippy]
redundant_clone = "deny"
