name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --release -p antumbra --features penumbra/serial
      - name: Package
        shell: bash
        run: |
          mkdir -p staging
          cp target/release/antumbra.exe staging/antumbra.exe
          7z a antumbra-windows-x86_64.zip staging/*
      - uses: actions/upload-artifact@v4
        with:
          name: antumbra-windows
          path: antumbra-windows-x86_64.zip

  build-cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Build CLI
        run: cargo build --release -p antumbra --features penumbra/serial
      - name: Package
        run: |
          mkdir -p staging
          cp target/release/antumbra staging/antumbra
          tar -czvf antumbra-linux-x86_64.tar.gz -C staging .
      - uses: actions/upload-artifact@v4
        with:
          name: antumbra-linux
          path: antumbra-linux-x86_64.tar.gz

  build-gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri build
      - name: List build output
        shell: bash
        run: find gui/src-tauri/target/release -maxdepth 3 -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.nsis" -o -name "*.zip" \) 2>/dev/null || echo "No installer files found"
      - name: Package
        shell: bash
        run: |
          mkdir -p staging
          find gui/src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.nsis" -o -name "*.zip" \) -exec cp {} staging/ \; 2>/dev/null || true
          if [ -z "$(ls staging/ 2>/dev/null)" ]; then
            echo "No bundle installers found, packaging raw binary"
            cp gui/src-tauri/target/release/penumbra-gui.exe staging/ 2>/dev/null || true
          fi
          cd staging && 7z a ../penumbra-gui-windows-x86_64.zip * && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: penumbra-gui-windows
          path: penumbra-gui-windows-x86_64.zip

  build-gui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri build
      - name: List build output
        run: find gui/src-tauri/target/release -maxdepth 3 -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" \) 2>/dev/null || echo "No installer files found"
      - name: Package
        run: |
          mkdir -p staging
          find gui/src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" \) -exec cp {} staging/ \; 2>/dev/null || true
          if [ -z "$(ls staging/ 2>/dev/null)" ]; then
            echo "No bundle installers found, packaging raw binary"
            cp gui/src-tauri/target/release/penumbra-gui staging/ 2>/dev/null || true
          fi
          tar -czvf penumbra-gui-linux-x86_64.tar.gz -C staging .
      - uses: actions/upload-artifact@v4
        with:
          name: penumbra-gui-linux
          path: penumbra-gui-linux-x86_64.tar.gz

  release:
    needs: [build-cli-windows, build-cli-linux, build-gui-windows, build-gui-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        path: artifacts
      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=nightly" >> $GITHUB_OUTPUT
          fi
      - name: List downloaded artifacts
        run: find artifacts -type f
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ steps.tag.outputs.tag == 'nightly' && 'Nightly Build' || steps.tag.outputs.tag }}
          tag: ${{ steps.tag.outputs.tag }}
          commit: ${{ github.sha }}
          artifacts: "artifacts/**/*.zip,artifacts/**/*.tar.gz"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
