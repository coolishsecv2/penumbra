name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build with serial support
        run: cargo build --release -p antumbra --features penumbra/serial
      - name: Prepare binary
        run: copy target\release\antumbra.exe antumbra-x86_64-windows.exe
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: antumbra-windows
          path: antumbra-x86_64-windows.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Build with serial support
        run: cargo build --release -p antumbra --features penumbra/serial
      - name: Prepare binary
        run: cp target/release/antumbra antumbra-x86_64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: antumbra-linux
          path: antumbra-x86_64-linux

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build with serial support
        run: cargo build --release -p antumbra --features penumbra/serial
      - name: Prepare binary
        run: cp target/release/antumbra antumbra-x86_64-macos
      - uses: actions/upload-artifact@v4
        with:
          name: antumbra-macos
          path: antumbra-x86_64-macos

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=nightly" >> $GITHUB_OUTPUT
          fi
      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ steps.tag.outputs.tag == 'nightly' && 'Nightly Build' || steps.tag.outputs.tag }}
          tag: ${{ steps.tag.outputs.tag }}
          commit: ${{ github.sha }}
          artifacts: >-
            antumbra-windows/antumbra-x86_64-windows.exe,
            antumbra-linux/antumbra-x86_64-linux,
            antumbra-macos/antumbra-x86_64-macos
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
