name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.publish-release.outputs.release_id }}
    steps:
      - name: Create or reuse nightly release
        id: publish-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagName = 'nightly';
            const releaseBody = [
              '## Penumbra nightly',
              '',
              'Built from the latest push to `main`.',
              '',
              '### Downloads',
              '',
              '- Windows: `.exe` and `.msi`',
              '- Linux: `.deb` and `.AppImage`',
              '- CLI: `antumbra` binary',
            ].join('\n');

            let release;

            try {
              const response = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tagName,
                name: 'Nightly Build',
                body: releaseBody,
                draft: false,
                prerelease: false,
                generate_release_notes: false,
                target_commitish: context.sha,
              });

              release = response.data;
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }

              const response = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: tagName,
              });

              release = response.data;
            }

            core.setOutput('release_id', String(release.id));

  build-gui-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: gui/src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci --no-audit --no-fund

      - name: Build and upload Tauri app
        uses: tauri-apps/tauri-action@v0.5.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          retryAttempts: 2
          tauriScript: npx tauri
          args: --bundles nsis,msi

  build-gui-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: gui/src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci --no-audit --no-fund

      - name: Build and upload Tauri app
        uses: tauri-apps/tauri-action@v0.5.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          retryAttempts: 2
          tauriScript: npx tauri
          args: --bundles deb,appimage

  build-cli-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --release -p antumbra --features penumbra/serial
      - name: Package
        shell: bash
        run: 7z a antumbra-windows-x86_64.exe.zip target/release/antumbra.exe
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload nightly antumbra-windows-x86_64.exe.zip --clobber

  build-cli-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Build CLI
        run: cargo build --release -p antumbra --features penumbra/serial
      - name: Package
        run: tar -czvf antumbra-linux-x86_64.tar.gz -C target/release antumbra
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload nightly antumbra-linux-x86_64.tar.gz --clobber
