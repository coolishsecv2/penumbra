name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --release -p antumbra --features penumbra/serial
      - name: Prepare binary
        run: copy target\release\antumbra.exe antumbra-x86_64-windows.exe
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: antumbra-windows
          path: antumbra-x86_64-windows.exe

  build-cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Build CLI
        run: cargo build --release -p antumbra --features penumbra/serial
      - name: Prepare binary
        run: cp target/release/antumbra antumbra-x86_64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: antumbra-linux
          path: antumbra-x86_64-linux

  build-gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: penumbra-gui-windows
          path: gui/src-tauri/target/release/bundle/**/*

  build-gui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: penumbra-gui-linux
          path: gui/src-tauri/target/release/bundle/**/*

  release:
    needs: [build-cli-windows, build-cli-linux, build-gui-windows, build-gui-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=nightly" >> $GITHUB_OUTPUT
          fi
      - name: Collect release files
        run: |
          mkdir -p release
          cp antumbra-windows/antumbra-x86_64-windows.exe release/ 2>/dev/null || true
          cp antumbra-linux/antumbra-x86_64-linux release/ 2>/dev/null || true
          find penumbra-gui-windows -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.zip' -o -name '*.nsis*' \) -exec cp {} release/ \; 2>/dev/null || true
          find penumbra-gui-linux -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \; 2>/dev/null || true
          ls -la release/
      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ steps.tag.outputs.tag == 'nightly' && 'Nightly Build' || steps.tag.outputs.tag }}
          tag: ${{ steps.tag.outputs.tag }}
          commit: ${{ github.sha }}
          artifacts: "release/*"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
